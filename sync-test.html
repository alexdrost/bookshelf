<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sync Diagnostic</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:640px;margin:40px auto;padding:0 20px;background:#f4efe4;color:#26211a;line-height:1.5}
h1{font-size:22px}
.step{border:1px solid #d8cdb8;border-radius:10px;padding:14px 16px;margin:12px 0;background:#fbf8f0}
.step h2{font-size:15px;margin:0 0 6px}
.ok{color:#2e5d4f;font-weight:600}.bad{color:#9c3022;font-weight:600}.pending{color:#a9752f}
code{background:#ece4d4;padding:1px 5px;border-radius:4px;font-size:13px}
.fix{margin-top:8px;font-size:14px;background:#f0e6d6;border-radius:8px;padding:10px 12px}
button{font-size:15px;padding:10px 18px;border:none;border-radius:8px;background:#7a3b2e;color:#fff;cursor:pointer;margin-top:6px}
small{color:#5c5346}
</style></head>
<body>
<h1>🔍 Bookshelf Sync Diagnostic</h1>
<p><small>This runs the same requests the review app makes, then tells you exactly what's working and what isn't. Nothing here saves real data — it writes one harmless test value and removes nothing.</small></p>
<button id="run">Run the test</button>
<div id="out"></div>

<script>
const URL_BASE = "https://bookshelf-review-sync.drost.workers.dev/state";
const SECRET = "7kmZUOQVQuxzBbscAMXZwftK";
const out = document.getElementById('out');

function card(title, statusHTML, fixHTML){
  const d=document.createElement('div'); d.className='step';
  d.innerHTML=`<h2>${title}</h2><div>${statusHTML}</div>`+(fixHTML?`<div class="fix">${fixHTML}</div>`:'');
  out.appendChild(d); return d;
}

document.getElementById('run').onclick = async () => {
  out.innerHTML='';
  // TEST 1: no-secret GET (should be 401 unauthorized = worker healthy)
  let t1=card('1. Is the Worker alive?', '<span class="pending">checking…</span>');
  try{
    const r=await fetch(URL_BASE);
    const txt=await r.text();
    if(r.status===401){ t1.querySelector('div').innerHTML='<span class="ok">✓ Worker is alive and the security gate works.</span>'; }
    else { t1.querySelector('div').innerHTML=`<span class="bad">✗ Unexpected: status ${r.status}, body: ${txt.slice(0,120)}</span>`; }
  }catch(e){ t1.querySelector('div').innerHTML=`<span class="bad">✗ Could not reach the Worker at all (${e.message}). The Worker URL may be wrong or not deployed.</span>`; }

  // TEST 2: GET with the secret (the real auth test)
  let t2=card('2. Does the secret match?', '<span class="pending">checking…</span>');
  let secretOK=false;
  try{
    const r=await fetch(URL_BASE,{headers:{'x-sync-secret':SECRET}});
    if(r.status===200){ secretOK=true; t2.querySelector('div').innerHTML='<span class="ok">✓ Secret matches — the Worker accepted it.</span>'; }
    else if(r.status===401){ t2.querySelector('div').innerHTML='<span class="bad">✗ 401 Unauthorized — the SYNC_SECRET on the Worker does NOT match.</span>';
      t2.querySelector('.fix')||t2.appendChild(Object.assign(document.createElement('div'),{className:'fix',innerHTML:
        'Fix: Worker → Settings → Variables and Secrets → delete <code>SYNC_SECRET</code>, add it again with value <code>'+SECRET+'</code> (check for a trailing space), choose Encrypt, then <b>Save and deploy</b>.'})); }
    else { t2.querySelector('div').innerHTML=`<span class="bad">✗ Unexpected status ${r.status}.</span>`; }
  }catch(e){
    t2.querySelector('div').innerHTML=`<span class="bad">✗ Request blocked before it returned — almost always CORS / origin mismatch (${e.message}).</span>`;
    t2.appendChild(Object.assign(document.createElement('div'),{className:'fix',innerHTML:
      'Fix: Worker → Settings → Variables and Secrets → set <code>ALLOW_ORIGIN</code> to exactly <code>'+location.origin+'</code> (this is the origin THIS page is served from), then Save and deploy.'}));
  }

  // TEST 3: write + read back (only if secret worked)
  let t3=card('3. Can it save and read back?', '<span class="pending">checking…</span>');
  if(!secretOK){ t3.querySelector('div').innerHTML='<span class="pending">Skipped — fix step 2 first.</span>'; return; }
  try{
    const token='diagnostic-'+Date.now();
    const w=await fetch(URL_BASE,{method:'PUT',headers:{'content-type':'application/json','x-sync-secret':SECRET},
      body:JSON.stringify({state:{diagnostic:token},updated:Date.now()})});
    if(!w.ok) throw new Error('write status '+w.status);
    const r=await fetch(URL_BASE,{headers:{'x-sync-secret':SECRET}});
    const j=await r.json();
    if(j.state && j.state.diagnostic===token){
      t3.querySelector('div').innerHTML='<span class="ok">✓ Full round-trip works. Sync is GOOD — upload the real review.html and it will sync across devices.</span>';
    } else { t3.querySelector('div').innerHTML='<span class="bad">✗ Wrote a value but read back something different. KV binding may be misconfigured.</span>'; }
  }catch(e){ t3.querySelector('div').innerHTML=`<span class="bad">✗ Save failed (${e.message}). The REVIEW KV binding may be missing or misnamed.</span>`; }

  card('This page also tells us your origin', `This page is served from <code>${location.origin}</code>.<br>Your Worker's <code>ALLOW_ORIGIN</code> must match this <b>exactly</b>.`);
};
</script>
</body></html>
