#!/usr/bin/env python3
"""
fetch_covers.py  -  Download book cover images for Alex's Bookshelf.

WHAT IT DOES
  1. For each book, tries to find a cover from Open Library (by ISBN) and
     Google Books (by ISBN, then title+author).
  2. Saves found covers as  covers/<bookId>.jpg
  3. Writes  missing.csv  listing the books it could NOT find a cover for
     (your manual worklist).

RE-RUNNABLE: already-downloaded covers are skipped, so you can run it again
after manually dropping JPGs into covers/ and it will only retry the gaps.

USAGE
  python3 fetch_covers.py
  (no arguments; the book list is embedded below)

Only uses the Python standard library. Needs internet access.
Run this from your repo ROOT so the covers/ folder lands in the right place.
"""

