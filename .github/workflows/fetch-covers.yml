name: Fetch Book Covers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: First pass — fetch all covers
        run: python3 fetch_covers.py

      - name: Second pass — retry missing with search
        run: python3 fetch_missing_covers.py

      - name: Third pass — hardcoded cover IDs
        run: python3 fetch_hardcoded_covers.py

      - name: Commit covers to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add covers/ missing.csv
          git diff --staged --quiet || git commit -m "Add book cover images"
          git pull --rebase origin main
          git push
