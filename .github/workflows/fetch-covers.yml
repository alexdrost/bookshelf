def get(url, timeout=15):
    req = urllib.request.Request(url, headers=UA)
    with urllib.request.urlopen(req, timeout=timeout) as r:
        return r.read()

def gb_thumb(isbn=None, title=None, author=None):
    """Query Google Books, return a usable https thumbnail URL or None."""
    try:
        if isbn:
            q = "isbn:" + isbn
        else:
            q = "intitle:" + (title or "")
            if author:
                q += " inauthor:" + author
        url = "https://www.googleapis.com/books/v1/volumes?q=" + urllib.parse.quote(q) + "&maxResults=1"
        data = json.loads(get(url).decode("utf-8"))
        items = data.get("items") or []
        if not items:
            return None
        links = (items[0].get("volumeInfo") or {}).get("imageLinks") or {}
        u = links.get("thumbnail") or links.get("smallThumbnail")
        if not u:
            return None
        # upgrade to a larger, https, un-curled image
        u = u.replace("http://", "https://").replace("&edge=curl", "").replace("zoom=1", "zoom=2")
        return u
    except Exception:
        return None

def try_download(book):
    """Return raw image bytes or None, trying OL ISBN -> GB ISBN -> GB title/author."""
    isbn = (book.get("isbn") or "").strip()
    # 1) Open Library by ISBN (direct image; ?default=false -> 404 if none)
    if isbn:
        try:
            data = get("https://covers.openlibrary.org/b/isbn/%s-L.jpg?default=false" % isbn)
            if data and len(data) > 3000:   # guard against tiny "blank" responses
                return data
        except Exception:
            pass
    # 2) Google Books by ISBN
    u = gb_thumb(isbn=isbn) if isbn else None
    # 3) Google Books by title + author
    if not u:
        u = gb_thumb(title=book.get("title"), author=book.get("author"))
    if u:
        try:
            data = get(u)
            if data and len(data) > 1500:
                return data
        except Exception:
            pass
    return None

def main():
    os.makedirs(COVERS_DIR, exist_ok=True)
    total = len(BOOKS)
    have, got, missing = 0, 0, []
    print("Fetching covers for %d books into ./%s/\n" % (total, COVERS_DIR))
    for i, b in enumerate(BOOKS, 1):
        path = os.path.join(COVERS_DIR, b["id"] + ".jpg")
        if os.path.exists(path) and os.path.getsize(path) > 1500:
            have += 1
            print("[%3d/%d] have   %s" % (i, total, b["title"][:55]))
            continue
        data = try_download(b)
        if data:
            with open(path, "wb") as f:
                f.write(data)
            got += 1
            print("[%3d/%d] OK     %s" % (i, total, b["title"][:55]))
        else:
            missing.append(b)
            print("[%3d/%d] MISS   %s" % (i, total, b["title"][:55]))
        time.sleep(SLEEP)

    # write the manual worklist
    if missing:
        import csv
        with open(MISSING_CSV, "w", newline="", encoding="utf-8") as f:
            w = csv.writer(f)
            w.writerow(["Book Id", "Title", "Author", "ISBN", "Save as"])
            for b in missing:
                w.writerow([b["id"], b["title"], b["author"], b.get("isbn",""), "covers/%s.jpg" % b["id"]])

    print("\n" + "=" * 50)
    print("Already had : %d" % have)
    print("Downloaded  : %d" % got)
    print("Still missing: %d  ->  see %s" % (len(missing), MISSING_CSV) if missing else "Still missing: 0")
    print("=" * 50)
    if missing:
        print("\nTo fill a gap by hand: find a cover image, save it as covers/<BookId>.jpg")
        print("(the exact filename is in the 'Save as' column of %s), then re-run this script." % MISSING_CSV)
    print("\nFinally: commit the covers/ folder to your repo. Cloudflare will serve them.")

if __name__ == "__main__":
    main()
