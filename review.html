<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bookshelf — Connections Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4efe4; --paper2:#ece4d4; --ink:#26211a; --ink2:#5c5346;
  --accent:#7a3b2e; --accent2:#2e5d4f; --gold:#a9752f;
  --line:#d8cdb8; --card:#fbf8f0; --shadow:0 1px 3px rgba(60,48,30,.12);
  --up:#2e5d4f; --down:#9c3022;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:'Newsreader',Georgia,serif;font-size:18px;line-height:1.55;
  background-image:radial-gradient(circle at 20% 10%,rgba(169,117,47,.05),transparent 60%),radial-gradient(circle at 80% 90%,rgba(46,93,79,.05),transparent 55%);}
.wrap{max-width:760px;margin:0 auto;padding:28px 22px 120px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.1;margin:0}

#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gatecard{background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 8px 30px rgba(60,48,30,.14);padding:40px 36px;max-width:420px;width:100%;text-align:center}
.gatecard .mark{font-family:'Fraunces';font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
.gatecard h1{font-size:30px;margin-bottom:8px}
.gatecard p{color:var(--ink2);font-size:15px;margin:6px 0 24px}
.gatecard input{width:100%;padding:13px 15px;font-family:'Newsreader',serif;font-size:17px;
  border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);text-align:center}
.gatecard input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,59,46,.12)}
.gatecard button{margin-top:16px;width:100%;padding:13px;font-family:'Fraunces';font-weight:600;font-size:16px;
  background:var(--accent);color:#fff;border:none;border-radius:9px;cursor:pointer;transition:background .15s}
.gatecard button:hover{background:#8c4636}
.err{color:var(--down);font-size:14px;height:18px;margin-top:10px;font-style:italic}

#app{display:none}
.topbar{position:sticky;top:0;z-index:20;background:rgba(244,239,228,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin:-28px -22px 22px;padding:14px 22px}
.topbar .row{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;justify-content:space-between}
.brand{font-family:'Fraunces';font-weight:600;font-size:15px;letter-spacing:.02em}
.brand span{color:var(--gold)}
.counter{font-size:13px;color:var(--ink2);font-feature-settings:"tnum"}
.bar{height:5px;background:var(--paper2);border-radius:3px;overflow:hidden;margin-top:10px;max-width:760px;margin-left:auto;margin-right:auto}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));width:0;transition:width .3s}
.toolbtns{display:flex;gap:7px}
.toolbtns button{font-family:'Newsreader',serif;font-size:13px;padding:6px 11px;border:1px solid var(--line);
  background:var(--card);color:var(--ink2);border-radius:7px;cursor:pointer;transition:all .14s}
.toolbtns button:hover{border-color:var(--accent);color:var(--accent)}

.bookcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:30px 30px 26px;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.idx{font-family:'Fraunces';font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}

/* main header w/ cover */
.bhead{display:flex;gap:20px;align-items:flex-start}
.bcover{width:104px;flex:none;aspect-ratio:2/3;border-radius:6px;background:var(--paper2);
  box-shadow:0 3px 10px rgba(60,48,30,.22);object-fit:cover;display:block}
.bcover-ph{width:104px;flex:none;aspect-ratio:2/3;border-radius:6px;
  background:linear-gradient(160deg,#ece4d4,#ddd0b8);box-shadow:0 3px 10px rgba(60,48,30,.18);
  display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;
  font-family:'Fraunces';font-size:12px;color:var(--ink2);line-height:1.25}
.btitle{font-size:28px;line-height:1.08;margin-bottom:4px}
.bauthor{font-style:italic;color:var(--ink2);font-size:18px}

.seclabel{font-family:'Fraunces';font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent2);margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.seclabel .mini{margin-left:auto}
.themes{font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{background:var(--paper2);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:14px;color:var(--ink2)}
.tagn{color:var(--gold);font-weight:600;margin-right:3px}

/* mini thumbs (for themes / tags sections) */
.mini{display:inline-flex;gap:5px}
.mini button{border:1px solid var(--line);background:var(--card);width:32px;height:28px;border-radius:7px;cursor:pointer;font-size:14px;transition:all .12s;display:flex;align-items:center;justify-content:center}
.mini button.on-up{background:var(--up);border-color:var(--up);color:#fff}
.mini button.on-down{background:var(--down);border-color:var(--down);color:#fff}
.minicmt{width:100%;margin-top:8px;min-height:42px;padding:9px 12px;font-family:'Newsreader',serif;font-size:15px;border:1px dashed var(--line);border-radius:9px;background:var(--paper);color:var(--ink);resize:vertical;display:none}
.minicmt.show{display:block}

/* links with covers */
.links{list-style:none;margin:6px 0 0;padding:0;counter-reset:lk}
.linkrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;margin-bottom:8px;background:var(--paper);transition:all .14s}
.linkrow .num{counter-increment:lk;font-family:'Fraunces';font-size:13px;color:var(--ink2);min-width:18px}
.linkrow .num::before{content:counter(lk) "."}
.lcover{width:38px;height:57px;flex:none;border-radius:3px;object-fit:cover;background:var(--paper2);box-shadow:0 1px 4px rgba(60,48,30,.2)}
.lcover-ph{width:38px;height:57px;flex:none;border-radius:3px;background:linear-gradient(160deg,#ece4d4,#ddd0b8);box-shadow:0 1px 4px rgba(60,48,30,.16)}
.linkrow .lt{flex:1;font-size:16px}
.linkrow.down{background:repeating-linear-gradient(45deg,var(--paper),var(--paper) 8px,#f0e6d6 8px,#f0e6d6 16px)}
.lk-toggle{display:flex;gap:4px}
.lk-toggle button{border:1px solid var(--line);background:var(--card);width:34px;height:30px;border-radius:7px;cursor:pointer;font-size:15px;transition:all .12s;display:flex;align-items:center;justify-content:center}
.lk-toggle button.on-up{background:var(--up);border-color:var(--up);color:#fff}
.lk-toggle button.on-down{background:var(--down);border-color:var(--down);color:#fff}

.verdict{display:flex;gap:10px;margin-top:8px}
.verdict button{flex:1;font-family:'Fraunces';font-weight:600;font-size:15px;padding:11px;border:1.5px solid var(--line);
  background:var(--card);border-radius:10px;cursor:pointer;transition:all .14s;color:var(--ink2)}
.verdict button.up.on{background:var(--up);border-color:var(--up);color:#fff}
.verdict button.down.on{background:var(--down);border-color:var(--down);color:#fff}
textarea.cmt{width:100%;margin-top:12px;min-height:70px;padding:12px 14px;font-family:'Newsreader',serif;font-size:16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
textarea.cmt:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,59,46,.1)}

.nav{display:flex;gap:12px;margin-top:22px}
.nav button{flex:1;font-family:'Fraunces';font-weight:600;font-size:16px;padding:13px;border:none;border-radius:10px;cursor:pointer;transition:all .15s}
.nav .prev{background:var(--paper2);color:var(--ink)}
.nav .prev:hover{background:#e0d6c2}
.nav .next{background:var(--accent);color:#fff}
.nav .next:hover{background:#8c4636}
.savednote{text-align:center;font-size:13px;color:var(--ink2);font-style:italic;margin-top:14px;height:16px}

.drawer{position:fixed;inset:0;background:rgba(38,33,26,.4);display:none;z-index:40;align-items:stretch;justify-content:flex-end}
.drawer.open{display:flex}
.drawerpanel{background:var(--card);width:min(420px,90vw);height:100%;overflow-y:auto;padding:20px;box-shadow:-6px 0 30px rgba(60,48,30,.2)}
.drawerpanel h3{font-size:18px;margin-bottom:4px}
.drawerpanel .sub{font-size:13px;color:var(--ink2);margin-bottom:14px}
.jumpfilter{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font-family:'Newsreader',serif;font-size:15px;margin-bottom:12px}
.jlist{list-style:none;margin:0;padding:0}
.jitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:15px;border:1px solid transparent}
.jitem:hover{background:var(--paper)}
.jitem.cur{border-color:var(--accent);background:var(--paper)}
.jitem .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--line)}
.jitem.done .dot{background:var(--up)}
.jitem.down .dot{background:var(--down)}
.jitem .jt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jitem .ji{font-size:12px;color:var(--ink2);font-family:'Fraunces'}
.closex{float:right;border:none;background:none;font-size:22px;cursor:pointer;color:var(--ink2);line-height:1}

.done{text-align:center;padding:50px 20px}
.done h2{font-size:34px;margin-bottom:10px}
.done p{color:var(--ink2);margin-bottom:6px}
.exportbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.exportbtns button{font-family:'Fraunces';font-weight:600;font-size:15px;padding:12px 22px;border-radius:10px;border:none;cursor:pointer}
.exportbtns .md{background:var(--accent2);color:#fff}
.exportbtns .jsonb{background:var(--accent);color:#fff}
.exportbtns .reset{background:var(--paper2);color:var(--ink2)}
.tinynote{font-size:12px;color:var(--ink2);margin-top:30px;line-height:1.5}
</style>
</head>
<body>

<div id="gate">
  <div class="gatecard">
    <div class="mark">Alex's Bookshelf</div>
    <h1>Connections Review</h1>
    <p>A private pass through every title — weigh in on its themes, terms, and links.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="off" autofocus>
    <div class="err" id="err"></div>
    <button id="enter">Enter</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="row">
      <div class="brand">Alex's Bookshelf <span>· Review</span></div>
      <div class="toolbtns">
        <button id="jumpBtn">Jump / List</button>
        <button id="finishBtn">Finish &amp; export</button>
      </div>
    </div>
    <div class="row" style="margin-top:8px"><div class="counter" id="counter"></div></div>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <div class="wrap" style="padding-top:0"><div id="stage"></div></div>
</div>

<div class="drawer" id="drawer">
  <div class="drawerpanel">
    <button class="closex" id="closeDrawer">&times;</button>
    <h3>All titles</h3>
    <div class="sub" id="drawersub"></div>
    <input class="jumpfilter" id="jumpfilter" placeholder="Filter by title or author…">
    <ul class="jlist" id="jlist"></ul>
  </div>
</div>

(Klein)", "gid": "36373587", "isbn": "9781501124815"}, {"label": "Jesus and John Wayne (Du Mez)", "gid": "53121662", "isbn": "9781631495731"}], "gid": "61278539", "isbn": "9781523523184"}, {"i": 301, "title": "How Clients Buy: A Practical Guide to Business Development for Consulting and Professional Services", "author": "Tom McMakin", "themes": "Business & Finance, Personal Growth & Leadership, Psychology & Mind", "tags": ["business development", "consulting", "applied research"], "links": [{"label": "How to Win Client Business (Fletcher)", "gid": "55180251", "isbn": "9781119676904"}, {"label": "The Snowball System (Bunnell)", "gid": "38740751", "isbn": "9781610399609"}, {"label": "Building a Story Brand (Miller)", "gid": "41215667", "isbn": ""}], "gid": "35863927", "isbn": "9781119434726"}, {"i": 302, "title": "I Moved Your Cheese: For Those Who Refuse to Live as Mice in Someone Else's Maze (Bk Business)", "author": "Deepak Malhotra", "themes": "Business & Finance, Personal Growth & Leadership", "tags": ["leadership"], "links": [{"label": "The Infinite Game (Sinek)", "gid": "38390751", "isbn": "9780735213500"}, {"label": "Liminal Thinking (Gray)", "gid": "30197119", "isbn": ""}, {"label": "The 4-Hour Workweek (Ferriss)", "gid": "368593", "isbn": "9780307353139"}], "gid": "10418591", "isbn": "9781609940652"}, {"i": 303, "title": "Rich Dad Poor Dad: What the Rich Teach Their Kids About Money—That the Poor and Middle Class Do Not!", "author": "Robert T. Kiyosaki", "themes": "Business & Finance", "tags": ["personal finance"], "links": [{"label": "The Psychology of Money (Housel)", "gid": "41881472", "isbn": ""}, {"label": "The 4-Hour Workweek (Ferriss)", "gid": "368593", "isbn": "9780307353139"}, {"label": "A Little History of Economics (Kishtainy)", "gid": "32622193", "isbn": "9780300206364"}], "gid": "69571", "isbn": "9780751532715"}, {"i": 304, "title": "The 5 Love Languages: The Secret to Love That Lasts", "author": "Gary Chapman", "themes": "Personal Growth & Leadership, Psychology & Mind", "tags": ["applied psychology"], "links": [{"label": "Daring Greatly (Brown)", "gid": "13588356", "isbn": "9781592407330"}, {"label": "The Four Agreements (Ruiz)", "gid": "6596", "isbn": "9781878424501"}, {"label": "How to Win Friends & Influence People (Carnegie)", "gid": "4865", "isbn": ""}], "gid": "23878688", "isbn": "9780802492401"}];
const PW = "Bookshelf4";
const KEY = "bookshelf_review_v2";
const COVER_BASE = "/covers/";              // self-hosted on bookshelf.drost.us
const OL = "https://covers.openlibrary.org/b/isbn/"; // ISBN fallback

let state = load();
function load(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.v===2) return s; }catch(e){}
  return { v:2, cur:0, books:{} };
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} flashSaved(); }
// per book: {themes:{v,c}, tags:{v,c}, book:{v,c}, links:{k:{v}}}
function bk(i){ if(!state.books[i]) state.books[i]={themes:{v:null,c:""},tags:{v:null,c:""},book:{v:null,c:""},links:{}}; 
  const r=state.books[i]; r.themes=r.themes||{v:null,c:""}; r.tags=r.tags||{v:null,c:""}; r.book=r.book||{v:null,c:""}; r.links=r.links||{}; return r; }

/* cover element builder: try self-hosted gid, then OpenLibrary isbn, then placeholder */
function coverHTML(o, cls, phcls, label){
  const sources=[];
  if(o.gid) sources.push(COVER_BASE+o.gid+".jpg");
  if(o.isbn) sources.push(OL+o.isbn+"-M.jpg?default=false");
  if(!sources.length) return `<div class="${phcls}">${esc(label||'')}</div>`;
  const data=sources.map(s=>s).join("|");
  return `<img class="${cls}" loading="lazy" src="${sources[0]}" data-fallbacks="${esc(data)}" data-step="0" data-ph="${esc(label||'')}" data-phcls="${phcls}" onerror="coverFail(this)">`;
}
function coverFail(img){
  const fbs=(img.getAttribute('data-fallbacks')||'').split('|');
  let step=+img.getAttribute('data-step')+1;
  if(step<fbs.length){ img.setAttribute('data-step',step); img.src=fbs[step]; }
  else{ const d=document.createElement('div'); d.className=img.getAttribute('data-phcls'); d.textContent=img.getAttribute('data-ph')||''; img.replaceWith(d); }
}
window.coverFail=coverFail;

const gate=document.getElementById('gate'), app=document.getElementById('app');
function tryEnter(){ const v=document.getElementById('pw').value;
  if(v===PW){ sessionStorage.setItem('bsr_ok','1'); showApp(); }
  else document.getElementById('err').textContent="That's not it — try again."; }
document.getElementById('enter').onclick=tryEnter;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryEnter();});
if(sessionStorage.getItem('bsr_ok')==='1') showApp();
function showApp(){ gate.style.display='none'; app.style.display='block'; render(); }

const stage=document.getElementById('stage');
let saveTimer=null;
function flashSaved(){ const n=document.getElementById('savednote'); if(n){ n.textContent='Saved'; clearTimeout(saveTimer); saveTimer=setTimeout(()=>{if(n)n.textContent='';},1200);} }

function miniThumbs(section, rec){
  const v=rec[section].v;
  return `<span class="mini" data-sec="${section}">
    <button data-v="up" class="${v==='up'?'on-up':''}" title="Thumbs up">&#128077;</button>
    <button data-v="down" class="${v==='down'?'on-down':''}" title="Thumbs down">&#128078;</button>
  </span>`;
}

function render(){
  const i=state.cur;
  if(i>=DATA.length){ renderDone(); return; }
  const b=DATA[i], rec=bk(i);
  updateProgress();

  const tags=b.tags.length? b.tags.map((t,k)=>`<span class="tag"><span class="tagn">${k+1}</span>${esc(t)}</span>`).join('') : '<span class="tag">—</span>';
  const links=b.links.length? b.links.map((l,k)=>{
    const lv=(rec.links[k]&&rec.links[k].v)||null;
    return `<li class="linkrow ${lv==='down'?'down':''}" data-k="${k}">
      <span class="num"></span>
      ${coverHTML(l,'lcover','lcover-ph','')}
      <span class="lt">${esc(l.label)}</span>
      <span class="lk-toggle">
        <button data-act="up" class="${lv==='up'?'on-up':''}" title="Thumbs up — good link">&#128077;</button>
        <button data-act="down" class="${lv==='down'?'on-down':''}" title="Thumbs down — bad link">&#128078;</button>
      </span></li>`;
  }).join('') : '<li class="linkrow"><span class="lt" style="color:var(--ink2);font-style:italic">No connections.</span></li>';

  stage.innerHTML=`
  <div class="bookcard">
    <div class="idx">Book ${i+1} of ${DATA.length}</div>
    <div class="bhead">
      ${coverHTML(b,'bcover','bcover-ph',b.title)}
      <div><div class="btitle">${esc(b.title)}</div><div class="bauthor">${esc(b.author||'')}</div></div>
    </div>

    <div class="seclabel">Themes ${miniThumbs('themes',rec)}</div>
    <div class="themes">${esc(b.themes||'—')}</div>
    <textarea class="minicmt ${rec.themes.c?'show':''}" id="cmt-themes" placeholder="Note on the themes…">${esc(rec.themes.c||'')}</textarea>

    <div class="seclabel">Associated terms (${b.tags.length}) ${miniThumbs('tags',rec)}</div>
    <div class="tags">${tags}</div>
    <textarea class="minicmt ${rec.tags.c?'show':''}" id="cmt-tags" placeholder="Note on the terms…">${esc(rec.tags.c||'')}</textarea>

    <div class="seclabel">Linked books (${b.links.length}) — &#128077; good link / &#128078; bad link</div>
    <ul class="links">${links}</ul>

    <div class="seclabel">Overall verdict on this book's connections</div>
    <div class="verdict">
      <button class="up ${rec.book.v==='up'?'on':''}" data-v="up">&#128077; Looks right</button>
      <button class="down ${rec.book.v==='down'?'on':''}" data-v="down">&#128078; Needs work</button>
    </div>
    <textarea class="cmt" id="cmt-book" placeholder="Comments — assumptions to test, links to add, swaps, anything to revisit…">${esc(rec.book.c||'')}</textarea>

    <div class="nav">
      <button class="prev" id="prevB">&larr; Back</button>
      <button class="next" id="nextB">${i===DATA.length-1?'Finish':'Skip / Next &rarr;'}</button>
    </div>
    <div class="savednote" id="savednote"></div>
  </div>`;

  // mini thumbs (themes, tags) — also reveal comment box
  stage.querySelectorAll('.mini').forEach(m=>{
    const sec=m.dataset.sec;
    m.querySelectorAll('button').forEach(btn=>{
      btn.onclick=()=>{ rec[sec].v = rec[sec].v===btn.dataset.v? null : btn.dataset.v;
        const box=document.getElementById('cmt-'+sec); if(box) box.classList.add('show');
        save(); render(); if(box){const b2=document.getElementById('cmt-'+sec); if(b2) b2.focus();} };
    });
  });
  // link thumbs
  stage.querySelectorAll('.linkrow[data-k]').forEach(row=>{
    const k=+row.dataset.k;
    row.querySelectorAll('.lk-toggle button').forEach(btn=>{
      btn.onclick=()=>{ if(!rec.links[k])rec.links[k]={v:null};
        rec.links[k].v = rec.links[k].v===btn.dataset.act? null : btn.dataset.act; save(); render(); };
    });
  });
  // overall verdict
  stage.querySelectorAll('.verdict button').forEach(btn=>{
    btn.onclick=()=>{ rec.book.v = rec.book.v===btn.dataset.v? null : btn.dataset.v; save(); render(); };
  });
  // comment persistence
  function wire(id,obj){ const ta=document.getElementById(id); if(!ta)return; ta.addEventListener('input',()=>{obj.c=ta.value;}); ta.addEventListener('blur',save); }
  wire('cmt-themes',rec.themes); wire('cmt-tags',rec.tags); wire('cmt-book',rec.book);

  function syncComments(){ ['themes','tags','book'].forEach(s=>{const id={themes:'cmt-themes',tags:'cmt-tags',book:'cmt-book'}[s]; const ta=document.getElementById(id); if(ta)rec[s].c=ta.value;}); }
  document.getElementById('prevB').onclick=()=>{ syncComments(); save(); if(state.cur>0){state.cur--;save();render();window.scrollTo(0,0);} };
  document.getElementById('nextB').onclick=()=>{ syncComments(); save(); state.cur++; save(); render(); window.scrollTo(0,0); };
}

function touched(r){ if(!r)return false;
  return (r.book&&(r.book.v||r.book.c&&r.book.c.trim())) || (r.themes&&(r.themes.v||r.themes.c&&r.themes.c.trim())) ||
         (r.tags&&(r.tags.v||r.tags.c&&r.tags.c.trim())) || (r.links&&Object.values(r.links).some(x=>x&&x.v)); }
function updateProgress(){
  const total=DATA.length; let n=0; for(const k in state.books) if(touched(state.books[k])) n++;
  document.getElementById('counter').textContent=`${n} of ${total} touched · viewing #${Math.min(state.cur+1,total)}`;
  document.getElementById('barfill').style.width=(100*Math.min(state.cur,total)/total)+'%';
}

function renderDone(){
  updateProgress(); document.getElementById('barfill').style.width='100%';
  let t=0,lu=0,ld=0,bu=0,bd=0;
  for(const k in state.books){ const r=state.books[k]; if(touched(r))t++;
    if(r.book.v==='up')bu++; if(r.book.v==='down')bd++;
    if(r.links) Object.values(r.links).forEach(x=>{if(x.v==='up')lu++; if(x.v==='down')ld++;}); }
  stage.innerHTML=`<div class="done">
    <h2>That's the shelf.</h2>
    <p>${t} of ${DATA.length} books touched.</p>
    <p>Links: ${lu} &#128077; / ${ld} &#128078; · Books overall: ${bu} &#128077; / ${bd} &#128078;</p>
    <div class="exportbtns">
      <button class="md" id="expMd">Download Markdown summary</button>
      <button class="jsonb" id="expJson">Download JSON</button>
    </div>
    <div class="exportbtns" style="margin-top:6px">
      <button class="prev" id="backToReview" style="font-family:Fraunces;font-weight:600;padding:10px 20px;border:1px solid var(--line);background:var(--card);border-radius:10px;cursor:pointer">&larr; Back to last book</button>
      <button class="reset" id="resetAll">Reset everything</button>
    </div>
    <div class="tinynote">Progress lives in this browser only and survives closing the tab.<br>Export before switching devices or clearing browser data.</div>
  </div>`;
  document.getElementById('expMd').onclick=exportMd;
  document.getElementById('expJson').onclick=exportJson;
  document.getElementById('backToReview').onclick=()=>{ state.cur=Math.max(0,DATA.length-1); save(); render(); window.scrollTo(0,0); };
  document.getElementById('resetAll').onclick=()=>{ if(confirm('Erase everything? Cannot be undone.')){ state={v:2,cur:0,books:{}}; save(); render(); } };
}
function dl(n,txt,ty){ const b=new Blob([txt],{type:ty}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=n; a.click(); URL.revokeObjectURL(u); }
function stamp(){ return new Date().toISOString().slice(0,10); }
function thumbWord(v){ return v==='up'?'👍 thumbs up':(v==='down'?'👎 thumbs down':''); }

function exportJson(){
  const out={exported:new Date().toISOString(),books:[]};
  DATA.forEach((b,i)=>{ const r=state.books[i]; if(!r||!touched(r))return;
    const links=b.links.map((l,k)=>({title:l.label, verdict:(r.links[k]&&r.links[k].v)||null}))
                       .filter(x=>x.verdict);
    out.books.push({title:b.title,author:b.author,
      themes:{text:b.themes,verdict:r.themes.v,comment:r.themes.c||""},
      tags:{terms:b.tags,verdict:r.tags.v,comment:r.tags.c||""},
      overall:{verdict:r.book.v,comment:r.book.c||""},
      links_rated:links});
  });
  dl(`bookshelf_review_${stamp()}.json`,JSON.stringify(out,null,2),'application/json');
}
function exportMd(){
  let m=`# Bookshelf Connections Review\n\nExported ${stamp()} — my thumbs-up/down calls and comments to test against.\n\n`;
  let any=false;
  DATA.forEach((b,i)=>{ const r=state.books[i]; if(!r||!touched(r))return; any=true;
    m+=`## ${b.title} — ${b.author}\n`;
    if(r.book.v) m+=`- **Overall:** ${thumbWord(r.book.v)}\n`;
    if(r.book.c&&r.book.c.trim()) m+=`- **Comment:** ${r.book.c.trim()}\n`;
    if(r.themes.v||((r.themes.c||'').trim())){ m+=`- **Themes** (${esc0(b.themes)}): ${thumbWord(r.themes.v)||'—'}`;
      if((r.themes.c||'').trim()) m+=` — _${r.themes.c.trim()}_`; m+=`\n`; }
    if(r.tags.v||((r.tags.c||'').trim())){ m+=`- **Terms**: ${thumbWord(r.tags.v)||'—'}`;
      if((r.tags.c||'').trim()) m+=` — _${r.tags.c.trim()}_`; m+=`\n`; }
    const up=[],down=[];
    b.links.forEach((l,k)=>{ const v=r.links[k]&&r.links[k].v; if(v==='up')up.push(l.label); if(v==='down')down.push(l.label); });
    if(up.length) m+=`- **Links 👍:** ${up.join('; ')}\n`;
    if(down.length) m+=`- **Links 👎:** ${down.join('; ')}\n`;
    m+=`\n`;
  });
  if(!any) m+=`_No books flagged._\n`;
  dl(`bookshelf_review_${stamp()}.md`,m,'text/markdown');
}
function esc0(s){return (s==null?'':String(s));}

const drawer=document.getElementById('drawer');
document.getElementById('jumpBtn').onclick=()=>{ buildJump(); drawer.classList.add('open'); };
document.getElementById('closeDrawer').onclick=()=>drawer.classList.remove('open');
drawer.addEventListener('click',e=>{ if(e.target===drawer) drawer.classList.remove('open'); });
document.getElementById('finishBtn').onclick=()=>{ state.cur=DATA.length; save(); render(); window.scrollTo(0,0); };
document.getElementById('jumpfilter').addEventListener('input',buildJump);
function buildJump(){
  const f=document.getElementById('jumpfilter').value.toLowerCase();
  const ul=document.getElementById('jlist'); ul.innerHTML='';
  document.getElementById('drawersub').textContent=`${DATA.length} titles · click to jump`;
  DATA.forEach((b,i)=>{
    if(f && !(b.title.toLowerCase().includes(f)||(b.author||'').toLowerCase().includes(f))) return;
    const r=state.books[i]; const cls=(r&&r.book&&r.book.v==='down')?'down':(touched(r)?'done':'');
    const li=document.createElement('li'); li.className=`jitem ${cls} ${i===state.cur?'cur':''}`;
    li.innerHTML=`<span class="dot"></span><span class="jt">${esc(b.title)}</span><span class="ji">#${i+1}</span>`;
    li.onclick=()=>{ state.cur=i; save(); drawer.classList.remove('open'); render(); window.scrollTo(0,0); };
    ul.appendChild(li);
  });
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
</script>
