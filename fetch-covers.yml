name: Fetch Book Covers

on:
  workflow_dispatch:  # lets you run it manually from the Actions tab

permissions:
  contents: write   # allows the workflow to commit files back to the repo

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download covers
        run: python3 fetch_covers.py

      - name: Commit covers to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add covers/ missing.csv
          git diff --staged --quiet || git commit -m "Add book cover images"
          git push
